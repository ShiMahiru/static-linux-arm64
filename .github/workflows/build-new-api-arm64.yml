name: build-new-api-arm64

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: QuantumNous/new-api

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 获取上游最新提交
        id: upstream
        run: |
          SHA=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/commits/main" | grep -o '"sha": *"[0-9a-f]\{40\}"' | head -1 | cut -d'"' -f4)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "上游 SHA = ${SHA}"

      - name: 恢复上次构建缓存
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .last-built-sha
          key: new-api-upstream-sha-${{ steps.upstream.outputs.sha }}

      - name: 对比并判断是否跳过
        run: |
          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "无法获取上游 SHA，跳过本次构建"
            echo 'SKIP=true' >> "$GITHUB_ENV"
          elif [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "该 SHA 已构建过，跳过本次构建"
            echo 'SKIP=true' >> "$GITHUB_ENV"
          else
            echo "检测到新提交，开始构建..."
            echo 'SKIP=false' >> "$GITHUB_ENV"
            echo "$UPSTREAM_SHA" > .last-built-sha
          fi

      - name: 无新提交则直接结束
        if: env.SKIP == 'true'
        run: exit 0

      - name: 拉取上游源码
        if: env.SKIP == 'false'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main

      - name: 安装 Go
        if: env.SKIP == 'false'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: 安装 Node
        if: env.SKIP == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 构建前端
        if: env.SKIP == 'false'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 编译静态 ARM64 二进制
        if: env.SKIP == 'false'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o new-api ./main.go
          ls -la new-api
          ( readelf -l new-api 2>/dev/null | grep -i interpreter && echo "!! 仍是动态链接" ) || echo "OK: 无 interpreter 依赖"

      - name: 发布到 GitHub Release
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          SHORT_SHA="${UPSTREAM_SHA:0:7}"
          TAG="new-api-${SHORT_SHA}"
          gh release create "$TAG" new-api \
            --repo "$GITHUB_REPOSITORY" \
            --title "New API ${SHORT_SHA}" \
            --notes "自动构建自上游 QuantumNous/new-api commit \`${UPSTREAM_SHA}\`" \
            --latest || true

      - name: 保存构建缓存
        if: env.SKIP == 'false'
        uses: actions/cache/save@v5
        with:
          path: .last-built-sha
          key: new-api-upstream-sha-${{ steps.upstream.outputs.sha }}
